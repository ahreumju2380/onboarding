<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 온보딩 프로그램 외출등록부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; color: #334155; }
        .glass-card { background: white; border: 1px solid #e2e8f0; border-radius: 1rem; }
        .status-badge { padding: 0.2rem 0.5rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; }
        .status-manual { background-color: #fef3c7; color: #92400e; }
        .status-present { background-color: #dcfce7; color: #166534; }
        .status-checkout { background-color: #dbeafe; color: #1e40af; }
        .btn-manual { font-size: 0.65rem; background-color: #f1f5f9; color: #64748b; padding: 4px 8px; border-radius: 6px; border: 1px solid #cbd5e1; cursor: pointer; }
        .active-tab { background-color: #2563eb !important; color: white !important; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
        <header class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-slate-900">2026 온보딩 프로그램 외출등록부</h1>
            </div>
            <div>
                <select id="month-filter" onchange="onMonthChange()" class="p-2 border border-slate-300 rounded-lg text-sm bg-white font-bold text-blue-600 shadow-sm">
                    <option value="8" selected>8월 입과 (8/10 시작)</option>
                    <option value="7">7월 입과 (7/6 시작)</option>
                </select>
            </div>
        </header>

        <div class="glass-card p-4 sm:p-6 shadow-sm border">
            <div class="flex gap-1.5 mb-4 overflow-x-auto pb-2">
                <button onclick="setDay(1)" id="btn-day1" class="px-4 py-2 rounded-lg bg-slate-100 text-sm font-bold active-tab">1일차</button>
                <button onclick="setDay(2)" id="btn-day2" class="px-4 py-2 rounded-lg bg-slate-100 text-sm font-bold">2일차</button>
                <button onclick="setDay(3)" id="btn-day3" class="px-4 py-2 rounded-lg bg-slate-100 text-sm font-bold">3일차</button>
                <button onclick="setDay(4)" id="btn-day4" class="px-4 py-2 rounded-lg bg-slate-100 text-sm font-bold">4일차</button>
            </div>
            
            <!-- 실시간 차수별 통계 현황 영역 -->
            <div id="stats-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3 mb-6"></div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="text-xs text-slate-500 uppercase border-b border-slate-100">
                        <tr>
                            <th class="p-3">학습자</th>
                            <th class="p-3">차수</th>
                            <th id="th-out" class="p-3">1일차 외출</th>
                            <th id="th-in" class="p-3">1일차 복귀</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-table-body" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- 연락처 상세 정보 모달 -->
    <div id="contact-modal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm shadow-xl">
            <h3 id="modal-name" class="font-bold text-lg mb-4 text-slate-900 border-b pb-2"></h3>
            <div class="space-y-2 text-sm text-slate-600">
                <p><strong>소속:</strong> <span id="modal-company"></span></p>
                <p><strong>직급:</strong> <span id="modal-rank"></span></p>
                <p><strong>연락처:</strong> <a id="modal-phone" href="" class="text-blue-600 font-bold hover:underline"></a></p>
            </div>
            <button onclick="document.getElementById('contact-modal').classList.add('hidden')" class="w-full mt-6 py-3 bg-slate-900 text-white rounded-xl font-bold">확인</button>
        </div>
    </div>

    <script>
        let currentDay = 1;
        let state = { 
            masterData: [], 
            attendanceData: [], 
            manualEntries: JSON.parse(localStorage.getItem('manual') || '{}') 
        };
        
        // 최신 올바른 배포 URL
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbzCaW1_mULECrs4VVJPz7C3zLelLL2dXFxk6YDs2O5oIMCIwAawLgaOB19US4DWXUL_/exec';
        
        function getStartDate() {
            const m = document.getElementById('month-filter') ? document.getElementById('month-filter').value : '8';
            return m === '7' ? new Date('2026-07-06T00:00:00') : new Date('2026-08-10T00:00:00');
        }

        function getDayFromDate(dateStr) {
            const date = new Date(dateStr);
            const startDate = getStartDate();
            const d1 = new Date(date.getFullYear(), date.getMonth(), date.getDate());
            const d2 = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
            const diffTime = d1.getTime() - d2.getTime();
            return Math.floor(diffTime / (1000 * 60 * 60 * 24)) + 1;
        }

        async function fetchSheetData() {
            try {
                const res = await fetch(scriptUrl + '?_=' + new Date().getTime());
                const data = await res.json();
                state.masterData = data.master || [];
                state.attendanceData = data.attendance || [];
                render();
            } catch (e) {
                console.error("데이터 로드 실패:", e);
            }
        }

        function onMonthChange() {
            render();
        }

        async function toggleManual(name, key) {
            const isDeleting = !!state.manualEntries[name]?.[key];
            const payload = { action: isDeleting ? 'delete' : 'add', name: name, key: key };

            if (isDeleting) {
                delete state.manualEntries[name][key];
            } else {
                if (!state.manualEntries[name]) state.manualEntries[name] = {};
                state.manualEntries[name][key] = new Date().toISOString();
            }
            localStorage.setItem('manual', JSON.stringify(state.manualEntries));
            render(); 
            fetch(scriptUrl, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        }

        function setDay(d) {
            currentDay = d;
            document.querySelectorAll('[id^="btn-day"]').forEach(b => b.classList.remove('active-tab'));
            document.getElementById(`btn-day${d}`).classList.add('active-tab');
            document.getElementById('th-out').textContent = `${d}일차 외출`;
            document.getElementById('th-in').textContent = `${d}일차 복귀`;
            render();
        }

        function showContact(name) {
            const student = state.masterData.find(m => m.name === name);
            if (!student) return;
            document.getElementById('modal-name').textContent = student.name;
            document.getElementById('modal-company').textContent = student.company || '정보 없음';
            document.getElementById('modal-rank').textContent = student.rank || '정보 없음';
            
            const phoneEl = document.getElementById('modal-phone');
            phoneEl.textContent = student.phone || '정보 없음';
            phoneEl.href = student.phone ? 'tel:' + student.phone : '#';
            
            document.getElementById('contact-modal').classList.remove('hidden');
        }

        function render() {
            const tbody = document.getElementById('attendance-table-body');
            tbody.innerHTML = '';
            
            const monthVal = document.getElementById('month-filter') ? document.getElementById('month-filter').value : '8';
            
            // 필터링 규칙 (8월 vs 7월)
            let students = state.masterData.filter(student => {
                const sess = String(student.session || '');
                const m = String(student.month || '');
                if (monthVal === '8') {
                    return sess.includes('8') || m.includes('8');
                } else {
                    return sess.includes('7') || m.includes('7') || (!sess.includes('8') && !m.includes('8'));
                }
            });

            // 예외 처리: 만약 필터 결과가 0명이고 전체 명단이 존재한다면 전체 명단을 표시 (데이터 누락 방지)
            if (students.length === 0 && state.masterData.length > 0) {
                students = state.masterData;
            }

            // 1. 실시간 차수별 통계 집계
            const stats = {};
            students.forEach(student => {
                const sName = student.session || '기타';
                if (!stats[sName]) {
                    stats[sName] = { total: 0, out: 0, in: 0 };
                }
                stats[sName].total++;

                const dailyLogs = state.attendanceData
                    .filter(a => a.name === student.name && getDayFromDate(a.time) === currentDay)
                    .sort((a,b) => new Date(a.time) - new Date(b.time));

                const outLog = dailyLogs[0];
                const inLog = dailyLogs[1];

                if (outLog) stats[sName].out++;
                if (inLog) stats[sName].in++;
            });

            // 2. 통계 카드 렌더링
            const statsContainer = document.getElementById('stats-container');
            if (statsContainer) {
                statsContainer.innerHTML = '';
                Object.keys(stats).sort().forEach(sName => {
                    const s = stats[sName];
                    statsContainer.innerHTML += `
                        <div class="bg-slate-50 border border-slate-200/60 rounded-xl p-3 flex flex-col justify-between shadow-sm">
                            <span class="text-xs font-bold text-slate-500 mb-2">${sName} 현황</span>
                            <div class="flex items-center justify-between text-sm gap-2">
                                <div class="bg-white px-2 py-1 rounded-lg border border-slate-100 flex-1 text-center">
                                    <div class="text-[9px] text-slate-400 font-bold uppercase leading-none mb-1">전체</div>
                                    <div class="font-bold text-slate-800">${s.total}명</div>
                                </div>
                                <div class="bg-blue-50/50 px-2 py-1 rounded-lg border border-blue-100/50 flex-1 text-center">
                                    <div class="text-[9px] text-blue-400 font-bold uppercase leading-none mb-1">외출</div>
                                    <div class="font-bold text-blue-600">${s.out}명</div>
                                </div>
                                <div class="bg-green-50/50 px-2 py-1 rounded-lg border border-green-100/50 flex-1 text-center">
                                    <div class="text-[9px] text-green-400 font-bold uppercase leading-none mb-1">복귀</div>
                                    <div class="font-bold text-green-600">${s.in}명</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            // 3. 메인 테이블 리스트 렌더링
            if (students.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center text-slate-400">등록된 학습자 명단이 없습니다.</td></tr>`;
                return;
            }

            students.forEach(student => {
                const dailyLogs = state.attendanceData
                    .filter(a => a.name === student.name && getDayFromDate(a.time) === currentDay)
                    .sort((a,b) => new Date(a.time) - new Date(b.time));

                const outLog = dailyLogs[0];
                const inLog = dailyLogs[1];

                tbody.innerHTML += `<tr>
                    <td class="p-3 font-bold cursor-pointer text-blue-600 hover:underline" onclick="showContact('${student.name.replace(/'/g, "\\'")}')">${student.name}</td>
                    <td class="p-3 text-xs text-slate-500">${student.session || '-'}</td>
                    <td class="p-3">${generateCell(student.name, outLog?.time, 'out' + currentDay, true)}</td>
                    <td class="p-3">${generateCell(student.name, inLog?.time, 'in' + currentDay, false)}</td>
                </tr>`;
            });
        }

        function generateCell(name, time, key, isOut) {
            const safeName = name.replace(/'/g, "\\'");
            const manualTime = state.manualEntries[name]?.[key];
            
            if (time) {
                return `<span class="status-badge ${isOut ? 'status-checkout' : 'status-present'}">${isOut ? '외출' : '복귀'}</span><span class="text-xs ml-1 font-mono">${new Date(time).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
            }
            if (manualTime) {
                return `<span onclick="toggleManual('${safeName}', '${key}')" class="status-badge status-manual">수동취소</span><span class="text-xs ml-1 font-mono">${new Date(manualTime).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span>`;
            }
            return `<button onclick="toggleManual('${safeName}', '${key}')" class="btn-manual">등록</button>`;
        }

        setInterval(fetchSheetData, 15000);
        window.onload = fetchSheetData;
    </script>
</body>
</html>
